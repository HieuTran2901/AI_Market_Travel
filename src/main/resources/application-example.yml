spring:
  application:
    name: ai-travel-marketplace
  profiles:
    active: prod

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/your_database_name?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:your_username}
    password: ${DATABASE_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:your_base64_encoded_jwt_secret}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

storage:
  type: local
  local:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:https://your-backend-url.com/uploads}

payment:
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESSKEY:}
    secret-key: ${MOMO_SECRETKEY:}
    endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:https://app.example.com/payments/momo/return}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    language: ${MOMO_LANGUAGE:en}
    timeout: ${MOMO_TIMEOUT:30s}

ai:
  provider: ${AI_PROVIDER:gemini}
  model: ${AI_MODEL:}
  trip-planner:
    structured-model: ${AI_TRIP_PLANNER_STRUCTURED_MODEL:google/gemini-2.0-flash-001}
    fallback-structured-model: ${AI_TRIP_PLANNER_FALLBACK_STRUCTURED_MODEL:openai/gpt-4o-mini}
    structured-json-schema-enabled: ${AI_TRIP_PLANNER_STRUCTURED_JSON_SCHEMA_ENABLED:true}
    reasoning-effort: ${AI_TRIP_PLANNER_REASONING_EFFORT:low}
    exclude-reasoning: ${AI_TRIP_PLANNER_EXCLUDE_REASONING:true}
    max-output-tokens-base: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_BASE:1600}
    max-output-tokens-per-day: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_PER_DAY:750}
    max-output-tokens-cap: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_CAP:6000}
    truncation-retry-multiplier: ${AI_TRIP_PLANNER_TRUNCATION_RETRY_MULTIPLIER:2}
    max-activities-per-day: ${AI_TRIP_PLANNER_MAX_ACTIVITIES_PER_DAY:4}
    max-description-words: ${AI_TRIP_PLANNER_MAX_DESCRIPTION_WORDS:20}
    max-listing-context-items: ${AI_TRIP_PLANNER_MAX_LISTING_CONTEXT_ITEMS:16}
    truncation-retry-enabled: ${AI_TRIP_PLANNER_TRUNCATION_RETRY_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  api-version: ${GEMINI_API_VERSION:v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:6000}
  temperature: ${GEMINI_TEMPERATURE:0.7}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  chat-path: ${OPENROUTER_CHAT_PATH:/chat/completions}
  model: ${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
  connect-timeout-seconds: ${OPENROUTER_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${OPENROUTER_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:6000}
  temperature: ${OPENROUTER_TEMPERATURE:0.7}
  http-referer: ${OPENROUTER_HTTP_REFERER:}
  title: ${OPENROUTER_TITLE:AI Travel Marketplace}

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  chat-path: ${GROQ_CHAT_PATH:/chat/completions}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  connect-timeout-seconds: ${GROQ_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${GROQ_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${GROQ_MAX_OUTPUT_TOKENS:6000}
  temperature: ${GROQ_TEMPERATURE:0.7}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.travel.marketplace: INFO
