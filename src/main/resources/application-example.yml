spring:
  application:
    name: ai-travel-marketplace
  profiles:
    active: prod

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/your_database_name?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:your_username}
    password: ${DATABASE_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:your_base64_encoded_jwt_secret}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

storage:
  type: local
  local:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:https://your-backend-url.com/uploads}

ai:
  provider: ${AI_PROVIDER:mock}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    max-tokens: 2048
    temperature: 0.7
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    max-tokens: 2048
    temperature: 0.7
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-haiku-20240307
    base-url: https://api.anthropic.com
    max-tokens: 2048
    temperature: 0.7

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.travel.marketplace: INFO
