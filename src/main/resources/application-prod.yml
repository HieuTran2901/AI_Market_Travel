spring:
  config:
    activate:
      on-profile: prod

  # ── Database (Railway MySQL) ────────────────────────────────────
  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT:3306}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate (Production schema validation) ──────────────
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # ── Flyway Migrations ───────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # ── File Upload Limits ──────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

  # ── Mail / SMTP Configuration ───────────────────────────────────
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

# ── Server (Railway PORT) ──────────────────────────────────────────
server:
  port: ${PORT:8080}

# ── OpenAPI / Swagger ──────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# ── Application Properties ─────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  otp:
    expiration-seconds: ${OTP_EXPIRATION_SECONDS:60}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-verification-attempts: ${OTP_MAX_VERIFICATION_ATTEMPTS:5}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:AI Travel Marketplace}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Storage Configuration ──────────────────────────────────────────
storage:
  type: ${STORAGE_TYPE:local}
  local:
    upload-dir: ${UPLOAD_DIR:./uploads}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8080/uploads}

# ── Payment Providers (MoMo & SePay) ───────────────────────────────
payment:
  momo:
    enabled: ${MOMO_ENABLED:false}
    partner-code: ${MOMO_PARTNER_CODE:MOMO}
    access-key: ${MOMO_ACCESSKEY:}
    secret-key: ${MOMO_SECRETKEY:}
    endpoint: ${MOMO_ENDPOINT:https://payment.momo.vn/v2/gateway/api/create}
    redirect-url: ${MOMO_REDIRECT_URL:}
    ai-coin-redirect-url: ${MOMO_AI_COIN_REDIRECT_URL:}
    ipn-url: ${MOMO_IPN_URL:}
    request-type: ${MOMO_REQUEST_TYPE:captureWallet}
    language: ${MOMO_LANGUAGE:en}
    timeout: ${MOMO_TIMEOUT:30s}

  sepay:
    enabled: ${SEPAY_ENABLED:false}
    environment: ${SEPAY_ENV:production}
    merchant-id: ${MERCHANTID:}
    secret-key: ${SEPAY_SECRETKEY:}
    ipn-secret: ${SEPAY_IPN_SECRET:}
    ipn-url: ${SEPAY_IPN_URL:}
    success-url: ${SEPAY_SUCCESS_URL:}
    error-url: ${SEPAY_ERROR_URL:}
    cancel-url: ${SEPAY_CANCEL_URL:}
    frontend-redirect-url: ${SEPAY_FRONTEND_REDIRECT_URL:}
    booking-frontend-redirect-url: ${SEPAY_BOOKING_FRONTEND_REDIRECT_URL:}

# ── AI Module Configuration ────────────────────────────────────────
ai:
  provider: ${AI_PROVIDER:gemini}
  model: ${AI_MODEL:}
  trip-planner:
    structured-model: ${AI_TRIP_PLANNER_STRUCTURED_MODEL:google/gemini-2.0-flash-001}
    fallback-structured-model: ${AI_TRIP_PLANNER_FALLBACK_STRUCTURED_MODEL:openai/gpt-4o-mini}
    structured-json-schema-enabled: ${AI_TRIP_PLANNER_STRUCTURED_JSON_SCHEMA_ENABLED:true}
    reasoning-effort: ${AI_TRIP_PLANNER_REASONING_EFFORT:low}
    exclude-reasoning: ${AI_TRIP_PLANNER_EXCLUDE_REASONING:true}
    max-output-tokens-base: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_BASE:1600}
    max-output-tokens-per-day: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_PER_DAY:750}
    max-output-tokens-cap: ${AI_TRIP_PLANNER_MAX_OUTPUT_TOKENS_CAP:6000}
    truncation-retry-multiplier: ${AI_TRIP_PLANNER_TRUNCATION_RETRY_MULTIPLIER:2}
    max-activities-per-day: ${AI_TRIP_PLANNER_MAX_ACTIVITIES_PER_DAY:4}
    max-description-words: ${AI_TRIP_PLANNER_MAX_DESCRIPTION_WORDS:20}
    max-listing-context-items: ${AI_TRIP_PLANNER_MAX_LISTING_CONTEXT_ITEMS:16}
    truncation-retry-enabled: ${AI_TRIP_PLANNER_TRUNCATION_RETRY_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  api-version: ${GEMINI_API_VERSION:v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  connect-timeout-seconds: ${GEMINI_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${GEMINI_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:6000}
  temperature: ${GEMINI_TEMPERATURE:0.7}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  chat-path: ${OPENROUTER_CHAT_PATH:/chat/completions}
  model: ${OPENROUTER_MODEL:nvidia/nemotron-3-super-120b-a12b:free}
  connect-timeout-seconds: ${OPENROUTER_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${OPENROUTER_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${OPENROUTER_MAX_OUTPUT_TOKENS:6000}
  temperature: ${OPENROUTER_TEMPERATURE:0.7}
  http-referer: ${OPENROUTER_HTTP_REFERER:}
  title: ${OPENROUTER_TITLE:AI Travel Marketplace}

groq:
  api-key: ${GROQ_API_KEY:}
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  chat-path: ${GROQ_CHAT_PATH:/chat/completions}
  model: ${GROQ_MODEL:openai/gpt-oss-120b}
  connect-timeout-seconds: ${GROQ_CONNECT_TIMEOUT_SECONDS:10}
  read-timeout-seconds: ${GROQ_READ_TIMEOUT_SECONDS:90}
  max-output-tokens: ${GROQ_MAX_OUTPUT_TOKENS:6000}
  temperature: ${GROQ_TEMPERATURE:0.7}

serpapi:
  api-key: ${SERPAPI_API_KEY:}
  base-url: ${SERPAPI_BASE_URL:https://serpapi.com}

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.travel.marketplace: INFO
