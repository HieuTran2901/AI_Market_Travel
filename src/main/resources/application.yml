spring:
  application:
    name: ai-travel-marketplace
  profiles:
    active: dev

  # ── Database (MySQL 8) ──────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/ai_travel_marketplace?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: root
    password: "1234"
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # ── Flyway ──────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # ── File Upload Limits ──────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

# ── OpenAPI / Swagger ──────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

# ── Application Properties ─────────────────────────────────────────
app:
  jwt:
    secret: 9a4f2c8d3b7a1e5f8c6b2d4e9f0a1c3b5d7e9f0a2b4c6d8e0f1a3c5b7d9e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c
    expiration-ms: 3600000        # 1 hour
    refresh-expiration-ms: 604800000  # 7 days

# ── Storage Configuration ──────────────────────────────────────────
storage:
  type: local
  local:
    upload-dir: ./uploads
    base-url: http://localhost:8080/uploads

# ── AI Module Configuration ────────────────────────────────────────
# Set ai.provider to: mock | gemini | openai | anthropic
# For development, leave as 'mock' — no API key required.
ai:
  provider: mock
  gemini:
    api-key: ""           # Set your Gemini API key here to activate
    model: gemini-1.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
    max-tokens: 2048
    temperature: 0.7
  openai:
    api-key: ""           # Set your OpenAI API key here to activate
    model: gpt-4o-mini
    base-url: https://api.openai.com/v1
    max-tokens: 2048
    temperature: 0.7
  anthropic:
    api-key: ""           # Set your Anthropic API key here to activate
    model: claude-3-haiku-20240307
    base-url: https://api.anthropic.com
    max-tokens: 2048
    temperature: 0.7

# ── Logging ────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    com.travel.marketplace: DEBUG
